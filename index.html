<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下班測試架構動態圖</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c5ccd8;
    --node: #ffffff; --node-line: #aab4c4;
    --accent: #2563eb; --accent-soft: #dbe7ff;
    --ok: #15803d; --ok-soft: #dcf5e4; --warn: #b45309; --warn-soft: #fdecc8; --bad: #b91c1c;
    --slack: #4a154b; --slack-soft: #f1e4f2;
    --pkt: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141c; --panel: #171e29; --ink: #e6ebf3; --muted: #93a0b4; --line: #3a4658;
      --node: #1b2432; --node-line: #46546a;
      --accent: #6ea0ff; --accent-soft: #1d2c4d;
      --ok: #55d58a; --ok-soft: #173525; --warn: #f0b25a; --warn-soft: #3a2c12; --bad: #ff7b7b;
      --slack: #d9a6db; --slack-soft: #2e1b30;
      --pkt: #8fb4ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141c; --panel: #171e29; --ink: #e6ebf3; --muted: #93a0b4; --line: #3a4658;
    --node: #1b2432; --node-line: #46546a;
    --accent: #6ea0ff; --accent-soft: #1d2c4d;
    --ok: #55d58a; --ok-soft: #173525; --warn: #f0b25a; --warn-soft: #3a2c12; --bad: #ff7b7b;
    --slack: #d9a6db; --slack-soft: #2e1b30;
    --pkt: #8fb4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 28px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
  svg { display: block; width: 100%; height: auto; }
  text { fill: var(--ink); font-size: 13px; }
  .t-muted { fill: var(--muted); font-size: 11.5px; }
  .t-title { font-size: 14.5px; font-weight: 700; }
  .t-col { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  .node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.4; transition: all .35s; }
  .node.on { stroke: var(--accent); fill: var(--accent-soft); stroke-width: 2.2; }
  .node.slack { stroke: var(--slack); }
  .node.slack.on { fill: var(--slack-soft); stroke: var(--slack); }
  .group { fill: none; stroke: var(--line); stroke-dasharray: 5 5; stroke-width: 1.2; }
  .chip { fill: var(--bg); stroke: var(--line); stroke-width: 1; transition: all .3s; }
  .chip.on { fill: var(--accent-soft); stroke: var(--accent); }
  .chip.ok { fill: var(--ok-soft); stroke: var(--ok); }
  .chip.warn { fill: var(--warn-soft); stroke: var(--warn); }
  .chip.run { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .wire { fill: none; stroke: var(--line); stroke-width: 1.8; transition: stroke .3s; }
  .wire.on { stroke: var(--accent); stroke-width: 2.4; }
  .wire.dash { stroke-dasharray: 6 5; }
  .wire.slackw.on { stroke: var(--slack); }
  .wlabel { fill: var(--muted); font-size: 11px; }
  .pkt { fill: var(--pkt); }
  .pkt.slackp { fill: var(--slack); }
  .msg { opacity: 0; transition: opacity .5s; }
  .msg.show { opacity: 1; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .dots { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
         font-size: 12px; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .dot.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dot.done { border-color: var(--accent); color: var(--accent); }
  .caption { padding: 14px 18px 18px; min-height: 108px; }
  .caption h2 { font-size: 17px; margin: 0 0 6px; }
  .caption p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--accent-soft);
         border: 1px solid var(--accent); color: var(--ink); border-radius: 6px; padding: 2px 8px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  @media (max-width: 700px) { .dots { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>下班測試：MCP 架構與自動化流程</h1>
      <div class="sub">從一句話觸發，到 MCP 排程、實機測試、Slack 通知結果</div>
    </div>
    <button id="theme" aria-label="切換深淺色">深色／淺色</button>
  </header>

  <div class="card">
    <div class="controls">
      <button id="play" class="primary">⏸ 暫停</button>
      <button id="prev">◀ 上一步</button>
      <button id="next">下一步 ▶</button>
      <button id="restart">↻ 重來</button>
      <div class="dots" id="dots" aria-label="步驟"></div>
    </div>

    <svg id="svg" viewBox="0 0 1280 700" role="img" aria-label="下班測試架構圖：觸發、MCP server、nightly runner、測試對象、報告與 Slack 通知">
      <text class="t-col" x="30" y="30">① 觸發</text>
      <text class="t-col" x="290" y="30">② MCP SERVER（gtid-qa）</text>
      <text class="t-col" x="680" y="30">③ 執行引擎</text>
      <text class="t-col" x="1000" y="30">④ 實機測試對象</text>
      <text class="t-col" x="680" y="470">⑤ 報告</text>
      <text class="t-col" x="1000" y="470">⑥ 通知</text>

      <path id="w_slack_bot" class="wire" d="M200 130 H290"/>
      <path id="w_claude_mcp" class="wire" d="M200 290 H290"/>
      <path id="w_mcp_runner" class="wire" d="M600 250 H680"/>
      <path id="w_runner_t1" class="wire" d="M910 205 H1000"/>
      <path id="w_runner_t2" class="wire" d="M910 260 H1000"/>
      <path id="w_runner_t3" class="wire" d="M910 315 H1000"/>
      <path id="w_runner_t4" class="wire" d="M910 370 H1000"/>
      <path id="w_runner_report" class="wire" d="M795 420 V500"/>
      <path id="w_report_slack" class="wire slackw" d="M910 565 H1000"/>
      <path id="w_progress" class="wire slackw dash" d="M910 410 C 960 410 960 520 1000 540"/>
      <path id="w_report_mcp" class="wire dash" d="M680 600 H420 V480"/>
      <path id="w_slack_user" class="wire slackw dash" d="M1140 660 V690 H15 V130 H30"/>

      <rect id="n_slack" class="node slack" x="30" y="90" width="170" height="80" rx="10"/>
      <text class="t-title" x="44" y="116">Slack 使用者</text>
      <text class="t-muted" x="44" y="136">@DoraTeam_AI</text>
      <text class="t-muted" x="44" y="153">「下班測試」</text>

      <rect id="n_claude" class="node" x="30" y="250" width="170" height="80" rx="10"/>
      <text class="t-title" x="44" y="276">Claude Code</text>
      <text class="t-muted" x="44" y="296">（MCP client）</text>
      <text class="t-muted" x="44" y="313">「Run nightly」</text>

      <text class="t-muted" x="30" y="390">slack_bot.py（Socket Mode）</text>
      <text class="t-muted" x="30" y="406">與 Claude 共用同一支</text>
      <text class="t-muted" x="30" y="422">start_nightly() 函式</text>

      <rect id="n_mcp" class="node" x="290" y="46" width="310" height="426" rx="12"/>
      <text class="t-title" x="306" y="72">gtid-qa MCP server</text>
      <text class="t-muted" x="306" y="90">FastMCP · 94 個 tool · 白名單＋token</text>

      <rect id="c_nightly" class="chip" x="306" y="104" width="278" height="44" rx="8"/>
      <text x="318" y="123" style="font-weight:600">下班測試</text>
      <text class="t-muted" x="318" y="140">gtid_nightly_start／status</text>

      <rect id="c_suite" class="chip" x="306" y="156" width="278" height="44" rx="8"/>
      <text x="318" y="175" style="font-weight:600">單項測試（suite）</text>
      <text class="t-muted" x="318" y="192">win11_* · ws2016_* · ws2012_* · macos_*</text>

      <rect id="c_job" class="chip" x="306" y="208" width="278" height="44" rx="8"/>
      <text x="318" y="227" style="font-weight:600">背景工作（job）</text>
      <text class="t-muted" x="318" y="244">job_status／job_log／cancel／list</text>

      <rect id="c_report" class="chip" x="306" y="260" width="278" height="44" rx="8"/>
      <text x="318" y="279" style="font-weight:600">報告</text>
      <text class="t-muted" x="318" y="296">latest_nightly_report／latest_results</text>

      <rect id="c_hw" class="chip" x="306" y="312" width="278" height="44" rx="8"/>
      <text x="318" y="331" style="font-weight:600">環境與硬體</text>
      <text class="t-muted" x="318" y="348">asuspc_status／ensure_adb／gui_*（9）</text>

      <rect id="c_api" class="chip" x="306" y="364" width="278" height="44" rx="8"/>
      <text x="318" y="383" style="font-weight:600">AdminPortal API 測試</text>
      <text class="t-muted" x="318" y="400">admin_api_*（5）</text>

      <rect id="c_guard" class="chip" x="306" y="418" width="278" height="44" rx="8"/>
      <text x="318" y="437" style="font-weight:600">防護</text>
      <text class="t-muted" x="318" y="454">confirm 確認 · 資源鎖 · 偵測其他測試</text>

      <rect id="n_runner" class="node" x="680" y="150" width="230" height="270" rx="12"/>
      <text class="t-title" x="696" y="176">nightly_runner.py</text>
      <text class="t-muted" x="696" y="194">52 個 suite · 失敗最多重試 3 次</text>
      <g id="suiteChips"></g>
      <text class="t-muted" x="696" y="408" id="runnerStat">待命</text>

      <rect id="n_t1" class="node" x="1000" y="180" width="270" height="50" rx="10"/>
      <text class="t-title" x="1014" y="203">MFA Server</text>
      <text class="t-muted" x="1014" y="220">部署版本 · AdminPortal · 認證記錄</text>

      <rect id="n_t2" class="node" x="1000" y="236" width="270" height="50" rx="10"/>
      <text class="t-title" x="1014" y="259">Win11 測試機 + 手機 + 金鑰</text>
      <text class="t-muted" x="1014" y="276">RDP · ADB · Arduino 觸碰 Idem Key</text>

      <rect id="n_t3" class="node" x="1000" y="292" width="270" height="50" rx="10"/>
      <text class="t-title" x="1014" y="315">Windows Server 2016／2012</text>
      <text class="t-muted" x="1014" y="332">RDP／SSH · 手機核准／安全碼</text>

      <rect id="n_t4" class="node" x="1000" y="348" width="270" height="50" rx="10"/>
      <text class="t-title" x="1014" y="371">macOS（VM／實體 Mac + iPhone）</text>
      <text class="t-muted" x="1014" y="388">VNC／SSH · 解鎖畫面 · 推播／OTP</text>

      <text class="wlabel" x="918" y="199">版本／API</text>
      <text class="wlabel" x="918" y="254">RDP·ADB</text>
      <text class="wlabel" x="918" y="309">RDP·SSH</text>
      <text class="wlabel" x="918" y="364">VNC·SSH</text>

      <rect id="n_report" class="node" x="680" y="500" width="230" height="130" rx="12"/>
      <text class="t-title" x="696" y="526">結果與報告</text>
      <text class="t-muted" x="696" y="546">每個 suite 的 JSON 結果</text>
      <text class="t-muted" x="696" y="564">彙整成 Markdown／JSON</text>
      <text class="t-muted" x="696" y="582">分區：Deploy · Win11 · WinServer</text>
      <text class="t-muted" x="696" y="600">AdminPortal · RADIUS · macOS</text>
      <text class="t-muted" x="696" y="618">失敗的 suite 與 TC 一併列出</text>

      <rect id="n_slack_out" class="node slack" x="1000" y="490" width="270" height="170" rx="12"/>
      <text class="t-title" x="1014" y="516" style="fill:var(--slack)">Slack 頻道</text>
      <g id="msgs">
        <g class="msg" id="m1"><rect x="1014" y="526" width="242" height="26" rx="6" fill="var(--slack-soft)"/><text x="1024" y="543">▶ 下班測試開始</text></g>
        <g class="msg" id="m2"><rect x="1014" y="556" width="242" height="26" rx="6" fill="var(--slack-soft)"/><text x="1024" y="573" id="m2t">✅ Win11　通過 N／N</text></g>
        <g class="msg" id="m3"><rect x="1014" y="586" width="242" height="26" rx="6" fill="var(--slack-soft)"/><text x="1024" y="603">🔁 重試後通過　…</text></g>
        <g class="msg" id="m4"><rect x="1014" y="616" width="242" height="36" rx="6" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="1024" y="632" style="font-weight:700">📊 最終報告（分區）</text><text class="t-muted" x="1024" y="646">通過數 · 失敗 suite／TC</text></g>
      </g>

      <text class="wlabel" x="925" y="558">結果</text>
      <text class="wlabel" x="500" y="618">查詢報告</text>
      <text class="wlabel" x="500" y="684">使用者在 Slack 看到結果</text>
    </svg>

    <div class="caption" aria-live="polite">
      <h2 id="capTitle"></h2>
      <p id="capDesc"></p>
      <div class="tags" id="capTags"></div>
      <div class="note">動畫為流程示意，數字與通過／失敗狀態僅作說明，不是實際測試結果。</div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("#svg");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("#theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark"
                                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });

  const STAGES = ["Deploy", "Win11", "WS2016", "WS2012", "AdminPortal", "RADIUS", "macOS"];
  const chipG = $("#suiteChips");
  const chips = STAGES.map((name, i) => {
    const g = document.createElementNS(NS, "g");
    const r = document.createElementNS(NS, "rect");
    const x = 696, y = 206 + i * 28;
    r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 198); r.setAttribute("height", 22);
    r.setAttribute("rx", 6); r.setAttribute("class", "chip");
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", x + 10); t.setAttribute("y", y + 15); t.textContent = (i + 1) + ". " + name;
    const s = document.createElementNS(NS, "text");
    s.setAttribute("x", x + 186); s.setAttribute("y", y + 15); s.setAttribute("text-anchor", "end");
    g.appendChild(r); g.appendChild(t); g.appendChild(s); chipG.appendChild(g);
    return { r, s };
  });

  const nodeIds = ["n_slack","n_claude","n_mcp","n_runner","n_t1","n_t2","n_t3","n_t4","n_report","n_slack_out"];
  const mcpChips = ["c_nightly","c_suite","c_job","c_report","c_hw","c_api","c_guard"];
  const wireIds = ["w_slack_bot","w_claude_mcp","w_mcp_runner","w_runner_t1","w_runner_t2","w_runner_t3",
                   "w_runner_t4","w_runner_report","w_report_slack","w_progress","w_report_mcp","w_slack_user"];

  function setOn(ids, on) { ids.forEach((id) => { const e = document.getElementById(id); if (e) e.classList.toggle("on", on); }); }
  function clearAll() {
    setOn(nodeIds, false); setOn(mcpChips, false); setOn(wireIds, false);
    chips.forEach((c) => { c.r.setAttribute("class", "chip"); c.s.textContent = ""; });
    $("#runnerStat").textContent = "待命";
    ["m1","m2","m3","m4"].forEach((id) => document.getElementById(id).classList.remove("show"));
  }

  let packets = [];
  function sendPackets(wires, slackColor) {
    wires.forEach((id, k) => {
      const path = document.getElementById(id);
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("r", 5.5);
      c.setAttribute("class", "pkt" + (slackColor || path.classList.contains("slackw") ? " slackp" : ""));
      svg.appendChild(c);
      packets.push({ c, path, len: path.getTotalLength(), t0: performance.now() + k * 180 });
    });
  }
  function clearPackets() { packets.forEach((p) => p.c.remove()); packets = []; }
  function tick(now) {
    packets.forEach((p) => {
      if (reduce) { p.c.setAttribute("opacity", 0); return; }
      const dur = 1500;
      const ph = ((now - p.t0) % (dur + 500) + (dur + 500)) % (dur + 500);
      if (ph > dur) { p.c.setAttribute("opacity", 0); return; }
      const pt = p.path.getPointAtLength(p.len * (ph / dur));
      p.c.setAttribute("cx", pt.x); p.c.setAttribute("cy", pt.y); p.c.setAttribute("opacity", 1);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function runSuites(withRetry) {
    STAGES.forEach((_, i) => {
      later(() => {
        chips[i].r.setAttribute("class", "chip run"); chips[i].s.textContent = "執行中…";
        $("#runnerStat").textContent = "第 " + (i + 1) + " / " + STAGES.length + " 區塊";
        if (i > 0) { const p = chips[i-1]; if (!p.r.classList.contains("warn")) { p.r.setAttribute("class", "chip ok"); p.s.textContent = "✓"; } }
      }, 600 + i * 900);
      if (withRetry && i === 2) {
        later(() => { chips[2].r.setAttribute("class", "chip warn"); chips[2].s.textContent = "重試 2/3 ✓"; }, 600 + i * 900 + 650);
      }
    });
    later(() => { const p = chips[STAGES.length - 1]; p.r.setAttribute("class", "chip ok"); p.s.textContent = "✓";
                  $("#runnerStat").textContent = "全部區塊完成"; }, 600 + STAGES.length * 900);
  }

  const STEPS = [
    { title: "1　一句話觸發",
      desc: "在 Slack 對機器人說「下班測試」，或在 Claude Code 說「Run nightly」。兩個入口共用同一支啟動函式，行為一致。",
      tags: ["@DoraTeam_AI 下班測試", "gtid_nightly_start(confirm=true)"],
      enter() { setOn(["n_slack","n_claude"], true); setOn(["w_slack_bot","w_claude_mcp"], true);
                sendPackets(["w_slack_bot","w_claude_mcp"]);
                later(() => { document.getElementById("m1").classList.add("show"); }, 1200); } },
    { title: "2　MCP 先做防護檢查",
      desc: "MCP server 先確認有 confirm、沒有別的測試在跑、機器沒被占用（資源鎖）。通過後建立背景工作（job），回傳 job 編號，不會卡住對話。",
      tags: ["confirm 確認", "資源鎖 asuspc／macbook／手機", "gtid_job_status"],
      enter() { setOn(["n_mcp","c_nightly","c_guard","c_job"], true); } },
    { title: "3　nightly_runner 依序執行 suite",
      desc: "整批 52 個 suite 依區塊執行：版本部署確認 → Win11 → WinServer 2016／2012 → AdminPortal → RADIUS → macOS。每個 suite 是一支 pytest。",
      tags: ["nightly_runner.py", "pytest", "52 suites"],
      enter() { setOn(["n_mcp","c_nightly","c_job","n_runner","w_mcp_runner"], true); sendPackets(["w_mcp_runner"]); runSuites(false); } },
    { title: "4　操作真實的測試機器",
      desc: "測試不是模擬：透過 RDP／SSH 登入 Windows 與 Mac，用 ADB 操作手機核准推播、取安全碼，用 Arduino 觸碰 Idem Key，並檢查 MFA Server 的版本與認證記錄。",
      tags: ["RDP", "SSH", "ADB", "Arduino", "VNC", "MFA log"],
      enter() { setOn(["n_runner","n_t1","n_t2","n_t3","n_t4","w_runner_t1","w_runner_t2","w_runner_t3","w_runner_t4"], true);
                sendPackets(["w_runner_t1","w_runner_t2","w_runner_t3","w_runner_t4"]);
                const p = chips; p.forEach((c) => c.r.setAttribute("class", "chip"));
                runSuites(false); } },
    { title: "5　失敗自動重試，每個 suite 都留結果",
      desc: "環境偶發失敗（手機沒回應、畫面沒對上）會自動重試，最多 3 次；仍失敗才記為 FAIL，並保留 JSON 結果、log 與截圖供分析。",
      tags: ["最多重試 3 次", "results JSON", "log／截圖"],
      enter() { setOn(["n_runner","n_report","w_runner_report"], true); sendPackets(["w_runner_report"]); runSuites(true);
                later(() => document.getElementById("m2").classList.add("show"), 2200);
                later(() => document.getElementById("m3").classList.add("show"), 3300); } },
    { title: "6　進度與報告彙整",
      desc: "每跑完一個 suite 就把進度推到 Slack；全部結束後把結果彙整成分區報告（Markdown／JSON）。想再查可用 MCP 的報告 tool 讀最新一份。",
      tags: ["slack_progress", "gtid_latest_nightly_report", "分區報告"],
      enter() { setOn(["n_runner","n_report","n_slack_out","w_progress","w_report_slack","w_report_mcp","c_report"], true);
                sendPackets(["w_progress","w_report_slack","w_report_mcp"]);
                ["m1","m2","m3"].forEach((id) => document.getElementById(id).classList.add("show")); } },
    { title: "7　結果通知到 Slack",
      desc: "最終報告以分區格式發到 Slack：總通過數、各區塊結果，以及失敗的 suite 與 TC。使用者不必守在電腦前，隔天打開 Slack 就看得到。",
      tags: ["Slack Block Kit 報告", "失敗 suite／TC", "gtid_nightly_status"],
      enter() { setOn(["n_report","n_slack_out","n_slack","w_report_slack","w_slack_user"], true);
                sendPackets(["w_report_slack","w_slack_user"], true);
                ["m1","m2","m3"].forEach((id) => document.getElementById(id).classList.add("show"));
                later(() => document.getElementById("m4").classList.add("show"), 900);
                chips.forEach((c) => { c.r.setAttribute("class", "chip ok"); c.s.textContent = "✓"; });
                chips[2].r.setAttribute("class", "chip warn"); chips[2].s.textContent = "重試 ✓"; } },
  ];

  let cur = 0, playing = true, advance = null;
  const STEP_MS = 6500;
  const dotsEl = $("#dots");
  STEPS.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "dot"; b.textContent = i + 1; b.setAttribute("aria-label", "第 " + (i + 1) + " 步");
    b.addEventListener("click", () => go(i));
    dotsEl.appendChild(b);
  });

  function render() {
    clearTimers(); clearPackets(); clearAll();
    const s = STEPS[cur];
    s.enter();
    $("#capTitle").textContent = s.title;
    $("#capDesc").textContent = s.desc;
    const tg = $("#capTags"); tg.textContent = "";
    s.tags.forEach((t) => { const e = document.createElement("span"); e.className = "tag"; e.textContent = t; tg.appendChild(e); });
    [...dotsEl.children].forEach((d, i) => { d.className = "dot" + (i === cur ? " cur" : i < cur ? " done" : ""); });
    schedule();
  }
  function schedule() {
    clearTimeout(advance);
    if (playing) advance = setTimeout(() => { go((cur + 1) % STEPS.length); }, STEP_MS);
  }
  function go(i) { cur = (i + STEPS.length) % STEPS.length; render(); }

  $("#play").addEventListener("click", () => {
    playing = !playing; $("#play").textContent = playing ? "⏸ 暫停" : "▶ 播放"; schedule();
  });
  $("#next").addEventListener("click", () => go(cur + 1));
  $("#prev").addEventListener("click", () => go(cur - 1));
  $("#restart").addEventListener("click", () => go(0));
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(cur + 1);
    else if (e.key === "ArrowLeft") go(cur - 1);
    else if (e.key === " ") { e.preventDefault(); $("#play").click(); }
  });

  if (reduce) { playing = false; $("#play").textContent = "▶ 播放"; }
  render();
})();
</script>
</body>
</html>
